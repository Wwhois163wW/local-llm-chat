# This is an example configuration file.
# Copy this file to 'config.ini' and fill in your actual details.
# 'config.ini' is ignored by git.

[LLM]
ip = 127.0.0.1
port = 8000
api_key = not-needed
model = local-model
max_history_length = 10
max_file_size_kb = 10240
max_read_file_output_tokens = 500 # Max tokens for file content injected into context


[logging]
# You can override the default console log level here.
# Valid levels are: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO
summary_model = openai/gpt-oss-small
compression_threshold = 8

[Agent]
# Maximum tool call turns per session to prevent infinite loops
max_turns = 3
# Enable for real-time observation visibility in console
debug_mode = false
